name: macOS validation

on:
  push:
    branches: [interface-rework]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select latest installed stable Xcode
        shell: bash
        run: |
          XCODE_PATH=$(python3 - <<'PY'
          import glob, plistlib, re
          choices = []
          for path in glob.glob('/Applications/Xcode*.app'):
              if 'beta' in path.lower():
                  continue
              with open(path + '/Contents/Info.plist', 'rb') as f:
                  version = plistlib.load(f)['CFBundleShortVersionString']
              choices.append((tuple(map(int, re.findall(r'\d+', version))), path))
          if not choices:
              raise SystemExit('No stable Xcode found')
          print(max(choices)[1])
          PY
          )
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build application
        run: swift build -c debug
      - name: Settings search checks
        if: ${{ !cancelled() }}
        run: ./scripts/verify-settings-search.sh
      - name: Notification checks
        if: ${{ !cancelled() }}
        run: ./scripts/verify-notifications.sh
      - name: MatriX downgrade checks
        if: ${{ !cancelled() }}
        run: ./scripts/verify-matrix-downgrade.sh
      - name: Native settings search UI checks
        if: ${{ !cancelled() }}
        run: ./scripts/verify-settings-search-ui.sh
      - name: Native menu bar UI checks
        if: ${{ !cancelled() }}
        env:
          MENU_BAR_SNAPSHOT_DIR: .build/menu-bar-snapshots
        run: ./scripts/verify-menu-bar-ui.sh
      - name: Upload native menu bar previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: menu-bar-native-previews-macos-15
          path: .build/menu-bar-snapshots/*.png
          if-no-files-found: ignore
      - name: What’s New content and history checks
        if: ${{ !cancelled() }}
        run: ./scripts/verify-whats-new.sh
      - name: Native What’s New window checks
        if: ${{ !cancelled() }}
        env:
          WHATS_NEW_SNAPSHOT_DIR: .build/whats-new-snapshots
        run: ./scripts/verify-whats-new-ui.sh
      - name: Upload native window previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: whats-new-native-previews
          path: .build/whats-new-snapshots/*.png
          if-no-files-found: ignore

  menu-bar-macos-26:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Native menu bar UI checks on macOS 26
        env:
          MENU_BAR_SNAPSHOT_DIR: .build/menu-bar-snapshots
        run: ./scripts/verify-menu-bar-ui.sh
      - name: Upload native menu bar previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: menu-bar-native-previews-macos-26
          path: .build/menu-bar-snapshots/*.png
          if-no-files-found: ignore
